name: privacyguard
description: "AI Privacy Guard: warns you when another person may be looking at your phone screen. All face processing happens on the phone."
publish_to: 'none'

version: 1.0.0+1

environment:
  # Dart 3.6 = Flutter 3.27 or newer. (permission_handler needs 3.6.)
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Asks for the camera / notification permission and tells "denied" from "denied permanently".
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
